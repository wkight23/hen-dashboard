name: Constraint feed
on:
  schedule: [{ cron: "*/5 * * * *" }]
  workflow_dispatch:
permissions:
  contents: write
concurrency: constraint-feed
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python tools/fetch_constraints.py
        env:
          ERCOT_USERNAME: ${{ secrets.ERCOT_USERNAME }}
          ERCOT_PASSWORD: ${{ secrets.ERCOT_PASSWORD }}
          ERCOT_SUBSCRIPTION_KEY: ${{ secrets.ERCOT_SUBKEY }}
      - name: Commit
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add live_constraints.json
          git diff --staged --quiet || (git commit -m "Update constraints" && git pull --rebase && git push)
